openapi: 3.0.3
info:
  title: Synapse HTTP API
  description: |
    Local-first real-time data platform for AI harnesses.
    Datasource → Pipe → Endpoint / MCP. See docs/PRODUCTION_PLAN.md and docs/CLOUD.md.

    ## URL patterns (Phase C)

    | Mode | Prefix | Notes |
    |---|---|---|
    | Legacy / single-root | `/v1/*` | Default workspace — requires `SYNAPSE_WORKSPACE` env var or `--workspace` in `cloud serve`. Same paths as `synapse dev`. |
    | Multi-workspace | `/v1/w/{workspace_id}/*` | All verb paths under `/v1/` also exist under this prefix, scoped to a workspace. Token must match the workspace. |
    | Control plane (canonical) | `/v1/platform/orgs/{org_id}/workspaces` | Admin-token only. Org-scoped workspace listing/creation. |
    | Control plane (canonical) | `/v1/platform/orgs/{org_id}/workspaces/{workspace_id}/tokens` | Admin-token only. Token minting scoped to org→workspace. |
    | Control plane (flat alias) | `/v1/platform/workspaces`, `/v1/platform/tokens` | Flat aliases for backwards compat. Prefer nested canonical routes. |

    For multi-workspace deployments, use `/v1/w/{workspace_id}/recall` etc.
    The control-plane endpoints (`/v1/platform/*`) are only available in `synapse cloud serve` mode.

    ### Valid token scopes
    `ADMIN`, `PIPES:READ`, `EVENTS:WRITE`, `REMEMBER:WRITE`, `QUERY:READ`.
    `MIND:READ` and `MIND:WRITE` are **not** valid — the server rejects them with `400 unknown_scope`.

    ### Token lifecycle
    Only a SHA-256 digest of each token is persisted. The raw secret appears once,
    in the mint response; listings return metadata only. Revoke by token id with
    `POST /v1/platform/tokens/{token_id}/revoke` — the token is refused immediately
    and the revocation survives a restart.

    ### Metering
    `GET /v1/platform/usage` exports per-workspace request and ingest counters.
    They are raw counters, not an invoice: Synapse has no billing integration.
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8787
    description: Default local `synapse dev`
  - url: https://your-service.onrender.com
    description: Render cloud deployment (`synapse cloud serve`)
paths:
  /health:
    get:
      summary: Liveness + version
      security: []
      responses:
        "200":
          description: OK
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  product: { type: string }
                  version: { type: string }
  /ready:
    get:
      summary: Readiness (pipes loaded)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  pipes: { type: integer }
        "503":
          description: Not ready
  /v1/workspace:
    get:
      summary: List pipes in workspace
      responses:
        "200":
          description: Pipe catalog JSON
  /v1/endpoints:
    get:
      summary: List published endpoints
      responses:
        "200":
          description: Endpoint list
  /v1/events/{datasource}:
    post:
      summary: Ingest NDJSON events
      parameters:
        - name: datasource
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: { type: string }
          text/plain:
            schema: { type: string }
      responses:
        "200":
          description: Ingested count
        "413":
          description: Body exceeds 16 MiB
  /v1/query:
    post:
      summary: Query-API analog (filter datasource)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [datasource]
              properties:
                datasource: { type: string }
                where: { type: object, additionalProperties: { type: string } }
                limit: { type: integer, minimum: 1, maximum: 10000, default: 100 }
                offset: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paginated events
  /v1/remember:
    post:
      summary: Store a Mind claim
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [run_id, text]
              properties:
                run_id: { type: string }
                agent_id: { type: string }
                text: { type: string }
                confidence: { type: number }
      responses:
        "200":
          description: Stored claim
  /v1/recall:
    get:
      summary: Token-budgeted context pack
      parameters:
        - { name: run_id, in: query, schema: { type: string } }
        - { name: query, in: query, schema: { type: string } }
      responses:
        "200": { description: Context pack }
  /v1/plan:
    get:
      summary: Plan a goal into a task DAG
      parameters:
        - { name: goal, in: query, required: true, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Plan JSON }
  /v1/route:
    get:
      summary: Route query to tool/skill
      parameters:
        - { name: query, in: query, required: true, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Route JSON }
  /v1/impact:
    get:
      summary: Blast radius
      parameters:
        - { name: run_id, in: query, schema: { type: string } }
        - { name: node_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Impact JSON }
  /v1/dispute:
    get:
      summary: Find contradictory claims
      responses:
        "200": { description: Contradictions }
    post:
      summary: Write a manual dispute
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [run_id, a, b]
              properties:
                run_id: { type: string }
                a: { type: string }
                b: { type: string }
                reason: { type: string }
      responses:
        "200": { description: Dispute recorded }
  /v1/graph:
    get:
      summary: World/Work/Mind graph snapshot
      parameters:
        - { name: run_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Graph JSON }
  /v1/embed:
    get:
      summary: Hybrid embed recall
      parameters:
        - { name: run_id, in: query, schema: { type: string } }
        - { name: query, in: query, schema: { type: string } }
      responses:
        "200": { description: Ranked claims }
  /v1/diff:
    get:
      summary: Diff two runs
      parameters:
        - { name: run_a, in: query, schema: { type: string } }
        - { name: run_b, in: query, schema: { type: string } }
      responses:
        "200": { description: Diff JSON }
  /v1/consolidate:
    get:
      summary: Consolidate Mind claims
      parameters:
        - { name: run_id, in: query, schema: { type: string } }
      responses:
        "200": { description: Consolidation result }
  /v1/ops/activity:
    get:
      summary: Recent agent ops activity (tool calls, errors, LLM spans, plan steps)
      description: |
        Aggregates harness_events by agent_id and returns recent matching events.
        Requires QUERY:READ (or PIPES:READ / ADMIN) when auth is enabled.
      parameters:
        - { name: run_id, in: query, schema: { type: string } }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        "200":
          description: Agents aggregate + recent events
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      properties:
                        agent_id: { type: string }
                        events: { type: integer }
                        tool_calls: { type: integer }
                        errors: { type: integer }
                  events:
                    type: array
                    items: { type: object }
  /v1/checkpoint:
    post:
      summary: Snapshot datasource to named checkpoint
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
                datasource: { type: string, default: harness_events }
      responses:
        "200": { description: Checkpoint path + event count }
        "400": { description: Invalid name }
  /v1/reload:
    post:
      summary: Reload pipe definitions from disk
      responses:
        "200": { description: Reloaded }
  /v1/mcp:
    post:
      summary: MCP JSON-RPC over HTTP
      responses:
        "200": { description: JSON-RPC response }
  /v1/pipes/{name}:
    get:
      summary: Run a published pipe endpoint
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          schema: { type: string, enum: [json, ndjson, csv] }
        - name: limit
          in: query
          schema: { type: integer, maximum: 10000 }
      responses:
        "200": { description: Pipe result }
        "404": { description: Unknown pipe }
  /v1/datasources/{name}/data:
    get:
      summary: Tinybird-style datasource data API
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, maximum: 10000 }
        - name: offset
          in: query
          schema: { type: integer }
      responses:
        "200": { description: Filtered rows }

  /v1/workflows:
    get:
      summary: List workflow definitions
      responses:
        "200": { description: Workflow defs }
  /v1/workflows/{name}:
    get:
      summary: Show a workflow definition
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Workflow def }
        "404": { description: Unknown workflow }
  /v1/workflows/{name}/runs:
    post:
      summary: Start a durable workflow run
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input: { type: object }
                run_id: { type: string }
      responses:
        "200": { description: Run started }
  /v1/workflows/tick:
    post:
      summary: Tick all runnable workflow runs
      responses:
        "200": { description: Tick summary }
  /v1/workflow-runs:
    get:
      summary: List workflow runs
      responses:
        "200": { description: Runs }
  /v1/workflow-runs/{id}:
    get:
      summary: Get workflow run status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Run state }
        "404": { description: Unknown run }
  /v1/workflow-runs/{id}/signal:
    post:
      summary: Signal a waiting workflow run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string }
                payload: {}
      responses:
        "200": { description: Updated run }
  /v1/workflow-runs/{id}/cancel:
    post:
      summary: Cancel a workflow run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Cancelled run }
  /v1/workflow-runs/{id}/tick:
    post:
      summary: Tick one workflow run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Updated run }

  # ── Multi-workspace routing ────────────────────────────────────────────────
  # All /v1/* verb paths also exist under /v1/w/{workspace_id}/* scoped to a
  # specific workspace.  The examples below show the workspace-scoped variants
  # for the most common verbs; replace {workspace_id} with your workspace slug.

  /v1/w/{workspace_id}/events/{datasource}:
    post:
      summary: Ingest NDJSON events (workspace-scoped)
      tags: [multi-workspace]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
          description: Workspace identifier
        - name: datasource
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: { type: string }
          text/plain:
            schema: { type: string }
      responses:
        "200": { description: Ingested count }
        "401": { description: Missing or invalid token }
        "403": { description: Token workspace mismatch }
        "413": { description: Body exceeds 16 MiB }

  /v1/w/{workspace_id}/recall:
    get:
      summary: Token-budgeted context pack (workspace-scoped)
      tags: [multi-workspace]
      parameters:
        - { name: workspace_id, in: path, required: true, schema: { type: string } }
        - { name: run_id, in: query, schema: { type: string } }
        - { name: query, in: query, schema: { type: string } }
      responses:
        "200": { description: Context pack }
        "403": { description: Token workspace mismatch }

  /v1/w/{workspace_id}/remember:
    post:
      summary: Store a Mind claim (workspace-scoped)
      tags: [multi-workspace]
      parameters:
        - { name: workspace_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [run_id, text]
              properties:
                run_id: { type: string }
                agent_id: { type: string }
                text: { type: string }
                confidence: { type: number }
      responses:
        "200": { description: Stored }
        "403": { description: Token workspace mismatch }

  /v1/w/{workspace_id}/mcp:
    post:
      summary: MCP JSON-RPC (workspace-scoped)
      tags: [multi-workspace]
      parameters:
        - { name: workspace_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: JSON-RPC response }

  # ── Control plane (Phase C — `synapse cloud serve` only) ──────────────────
  # All control-plane routes require an admin token.

  /v1/platform/orgs:
    get:
      summary: List organizations
      tags: [control-plane]
      responses:
        "200":
          description: Array of org objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Org'
        "401": { description: Admin token required }
    post:
      summary: Create organization
      tags: [control-plane]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
      responses:
        "200":
          description: Created org
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Org' }
        "401": { description: Admin token required }
        "409": { description: Name already exists }

  /v1/platform/orgs/{org_id}/workspaces:
    get:
      summary: List workspaces in org
      tags: [control-plane]
      parameters:
        - { name: org_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Array of workspace objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
        "401": { description: Admin token required }
        "404": { description: Unknown org }
    post:
      summary: Create workspace in org
      tags: [control-plane]
      parameters:
        - { name: org_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
      responses:
        "200":
          description: Created workspace + admin token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceCreated' }
        "401": { description: Admin token required }
        "404": { description: Unknown org }

  /v1/platform/orgs/{org_id}/workspaces/{workspace_id}/tokens:
    post:
      summary: Mint scoped token for workspace
      tags: [control-plane]
      parameters:
        - { name: org_id, in: path, required: true, schema: { type: string } }
        - { name: workspace_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scope:
                  type: string
                  enum: [ADMIN, PIPES:READ, EVENTS:WRITE, REMEMBER:WRITE, QUERY:READ]
                  default: ADMIN
                  description: |
                    Single scope for the minted token.
                    ADMIN — full access; PIPES:READ — read endpoints/pipes;
                    EVENTS:WRITE — ingest only; REMEMBER:WRITE — remember/dispute;
                    QUERY:READ — datasource query only.
      responses:
        "200":
          description: Minted token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  name: { type: string }
                  workspace_id: { type: string }
                  scopes: { type: array, items: { type: string } }
        "401": { description: Admin token required }
        "404": { description: Unknown workspace }
    get:
      summary: List token metadata for a workspace
      description: Metadata only. Secrets are unrecoverable after minting.
      tags: [control-plane]
      parameters:
        - { name: org_id, in: path, required: true, schema: { type: string } }
        - { name: workspace_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Token metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenMetadata'
        "401": { description: Admin token required }
        "404": { description: Unknown org or workspace }

  /v1/platform/orgs/{org_id}/workspaces/{workspace_id}/tokens/{token_id}/revoke:
    post:
      summary: Revoke a workspace token
      description: Idempotent. A revoked token is refused by every workspace route.
      tags: [control-plane]
      parameters:
        - { name: org_id, in: path, required: true, schema: { type: string } }
        - { name: workspace_id, in: path, required: true, schema: { type: string } }
        - { name: token_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenRevoked' }
        "401": { description: Admin token required }
        "404": { description: Unknown org, workspace, or token }

  /v1/platform/tokens:
    get:
      summary: List token metadata (flat alias)
      description: Metadata only. Secrets are unrecoverable after minting.
      tags: [control-plane]
      parameters:
        - name: workspace_id
          in: query
          required: false
          schema: { type: string }
          description: Restrict the listing to one workspace. Omit to list all.
      responses:
        "200":
          description: Token metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenMetadata'
        "401": { description: Admin token required }
    post:
      summary: Mint scoped token (flat alias)
      tags: [control-plane]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id]
              properties:
                workspace_id: { type: string }
                name: { type: string, default: api }
                scope:
                  type: string
                  enum: [ADMIN, PIPES:READ, EVENTS:WRITE, REMEMBER:WRITE, QUERY:READ]
                  default: ADMIN
      responses:
        "200":
          description: Minted token. `token` is returned once and never again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenMinted' }
        "400": { description: Unknown workspace or scope }
        "401": { description: Admin token required }

  /v1/platform/tokens/{token_id}/revoke:
    post:
      summary: Revoke a token by id (flat alias)
      tags: [control-plane]
      parameters:
        - { name: token_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenRevoked' }
        "401": { description: Admin token required }
        "404": { description: Unknown token }

  /v1/platform/usage:
    get:
      summary: Per-workspace usage counters
      description: |
        Raw counters for billing to consume later. Synapse does not price, invoice,
        or charge anything; a billing job is expected to diff two snapshots.
      tags: [control-plane]
      responses:
        "200":
          description: Usage export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageExport' }
        "401": { description: Admin token required }

  /cloud:
    get:
      summary: Cloud admin console (HTML)
      description: |
        Static admin page, also served at `/ui/cloud`. Ships no secrets; the operator
        pastes an admin token into the page at runtime. Cloud mode only.
      tags: [control-plane]
      security: []
      responses:
        "200": { description: HTML page }

components:
  schemas:
    Org:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }

    Workspace:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        org_id: { type: string }
        created_at: { type: string, format: date-time }

    WorkspaceCreated:
      type: object
      properties:
        workspace: { $ref: '#/components/schemas/Workspace' }
        admin_token: { type: string }
        data_path: { type: string }

    TokenMetadata:
      type: object
      description: Everything the platform can still tell you about a token after minting.
      properties:
        id: { type: string, example: tok_9f1c2a3b4d5e6f70 }
        name: { type: string }
        org_id: { type: string }
        workspace_id: { type: string }
        created_at: { type: integer, description: Unix seconds }
        revoked: { type: boolean }
        scopes: { type: array, items: { type: string } }

    TokenMinted:
      type: object
      description: |
        The only response that contains a raw secret. Only its SHA-256 digest is
        persisted, so a lost token must be revoked and re-minted.
      properties:
        created: { type: boolean }
        id: { type: string }
        name: { type: string }
        token: { type: string, description: Raw secret, shown exactly once }
        workspace_id: { type: string }
        scopes: { type: array, items: { type: string } }
        created_at: { type: integer, description: Unix seconds }

    TokenRevoked:
      type: object
      properties:
        revoked: { type: boolean }
        id: { type: string }
        workspace_id: { type: string }
        already_revoked: { type: boolean }

    UsageExport:
      type: object
      properties:
        version: { type: integer }
        workspaces:
          type: array
          items:
            type: object
            properties:
              workspace_id: { type: string }
              requests: { type: integer, description: Authenticated workspace requests served }
              ingest_events: { type: integer, description: Events accepted by /v1/events/* }
              ingest_bytes: { type: integer, description: Raw ingest request body bytes }
              updated_at: { type: integer, description: Unix seconds of the last increment }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Scoped workspace token. Enable with SYNAPSE_REQUIRE_AUTH=1.
        In Phase C cloud mode tokens carry org_id, workspace_id, and scopes.
        Workspace-scoped tokens must match the {workspace_id} in the URL path.
    queryToken:
      type: apiKey
      in: query
      name: token
security:
  - bearerAuth: []
  - queryToken: []
